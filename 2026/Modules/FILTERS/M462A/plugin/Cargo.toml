# M462A EQ as a plugin. One crate, two uses:
#   - the full VST3 / CLAP plugin with the M466 front panel (default feature "vst"):
#       cargo xtask bundle wbs-m462a --release
#   - the DSP alone for the Ward-Beck Audio Tap's inserts:
#       wbs-m462a = { ..., default-features = false }
[package]
name = "wbs-m462a"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Ward-Beck"
description = "Ward-Beck M462A equaliser"
publish = false

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["vst"]
vst = ["dep:nih_plug", "dep:wbs-panel"]
# A window with the panel, no DAW needed (audio through JACK, or --backend dummy):
#   cargo run --release --features standalone --bin wbs-m462a-standalone
standalone = ["vst", "nih_plug/standalone"]

[[bin]]
name = "wbs-m462a-standalone"
path = "src/bin/standalone.rs"
required-features = ["standalone"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
wbs-panel = { git = "https://github.com/WardBeckSystems/Ward-Beck-Plugin-Core", optional = true }

[profile.release]
lto = "thin"
strip = "symbols"
