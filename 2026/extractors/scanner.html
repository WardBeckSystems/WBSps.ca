<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WBSps Scanner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap">
<style>
/* a typed sheet in the black WBS binder, like the archive's index pages */
:root { --vinyl:#151515; --paper:#fbfaf4; --type:#1f1e1c; --faint:#6d6a63; --rule:#d6d0c0; --link:#1f3f6b; --ok:#2e6b34; --warn:#a8442a; --hl:#f3e7a6 }
* { box-sizing:border-box }
html { background:var(--vinyl) }
body { margin:0; padding:28px 16px 60px; color:var(--type); font:15px/1.55 "Courier Prime","Courier New",Courier,monospace }
.page { max-width:1100px; margin:0 auto; background:var(--paper); padding:clamp(24px,5vw,56px) clamp(16px,5vw,60px) 48px; box-shadow:0 18px 40px rgba(0,0,0,.55) }
a { color:var(--link); text-underline-offset:3px }
.top { display:flex; flex-wrap:wrap; gap:4px 18px; font-size:13px }
h1 { font:700 19px/1.3 inherit; text-transform:uppercase; letter-spacing:.08em; text-align:center; margin:26px 0 4px; text-decoration:underline; text-underline-offset:6px }
.sub { text-align:center; color:var(--faint); font-size:13px; margin:0 0 22px }
h2 { font:700 15px/1.4 inherit; margin:26px 0 8px; text-decoration:underline; text-underline-offset:4px }
#drop { border:2px dashed var(--faint); padding:28px 16px; text-align:center; cursor:pointer }
#drop.over { background:var(--hl) }
#drop input { display:none }
.ext { list-style:none; margin:0; padding:0; columns:2 340px; column-gap:2.4em; font-size:13px }
.ext li { break-inside:avoid; padding:3px 0; border-bottom:1px dotted var(--rule) }
.ext b { font-weight:700 } .ext .n { float:right; font-variant-numeric:tabular-nums }
.card { border-top:1.5px solid var(--type); margin-top:26px; padding-top:12px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:14px 26px }
.card h3 { grid-column:1/-1; margin:0; font-size:15px; word-break:break-word }
.card canvas { width:100%; height:auto; background:#fff; border:1px solid var(--rule) }
.facts { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:3px 1.4em; font-size:13.5px; align-content:start }
.facts dt { color:var(--faint) } .facts dd { margin:0; word-break:break-word }
.chip { display:inline-block; border:1px solid var(--rule); padding:0 6px; margin:0 4px 3px 0; font-size:12.5px }
.ok { color:var(--ok); font-weight:700 } .warn { color:var(--warn); font-weight:700 }
.state { grid-column:1/-1; color:var(--faint) }
pre { white-space:pre-wrap; font-size:12px; max-height:260px; overflow:auto; border-left:3px solid var(--rule); padding-left:10px }
button { font:inherit; font-size:13px; background:transparent; border:1px solid var(--rule); padding:1px 8px; cursor:pointer; color:inherit }
@media (max-width:760px) { .card { grid-template-columns:1fr } }
</style>
</head>
<body>
<article class="page">
  <div class="top"><a href="/">← Extractor suite</a><a href="/archive/index.html">Archive index</a><a href="/archive/Home.html">Wiki</a><a href="/archive/status.html">Status</a></div>
  <h1>Scanner</h1>
  <p class="sub">Drop new scans here. Each one goes through the archive's own extractors: identity, Google Drive, rotation, OCR, title block, models, dates and where it would be filed.</p>

  <label id="drop" for="pick">Drop scans, photos or PDFs here, or click to choose them.<input id="pick" type="file" multiple accept="image/*,.pdf,.tif,.tiff"></label>
  <p class="sub" id="queue"></p>

  <div id="results"></div>

  <h2>The extractors</h2>
  <ul class="ext" id="ext"><li>Loading…</li></ul>
</article>
<script type="module" src="/src/scanner.ts"></script>
</body>
</html>
