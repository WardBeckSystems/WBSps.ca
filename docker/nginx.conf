# 2026/ is the web root; the pages reach the originals as ../WBSps.env/…, which is /WBSps.env/ here.
server {
    listen 80;
    server_name localhost;
    root /srv/WBSps.ca/2026;
    index index.html;
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/plain text/css text/markdown application/javascript application/json image/svg+xml;

    # file types the archive has that nginx does not know
    types {
        text/markdown md;
        text/plain yaml yml kicad_pcb kicad_sch kicad_sym kicad_pro kicad_prl kicad_mod sch dsn pcb brd;
    }
    include /etc/nginx/mime.types;

    location /WBSps.env/ {
        alias /srv/WBSps.ca/WBSps.env/;
    }
    # the timeline database and the scripts stay private even here
    location ~ \.(db|py|sh|pyc)$ { return 404; }
    location /timelines/.git { return 404; }
    # the extractor suite's code, OCR environments and node modules are tools, not archive pages
    location ~ ^/extractors/(ocr_tool|node_modules|rust_analyzer|src)/ { return 404; }
}
